name: dsh-compat

on:
  workflow_dispatch:
  schedule:
    # 每日检测一次：latest/next 若随 dsh 发版变化，矩阵中的 `latest` 项即装到新版并冒烟
    - cron: "17 2 * * *"
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PR 只跑 current latest（快速回归门）；schedule/manual 跑全矩阵
        # latest 项自动跟到 dsh 新 promote 的稳定版（含未来 0.1.3 stable），无需单列 alpha
        dsh: ${{ github.event_name == 'pull_request' && fromJSON('["latest"]') || fromJSON('["0.1.1-rc.2","0.1.2-rc.1","latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gateway (and its workspace dep rdsh-tunnel)
        run: pnpm --filter rdsh-tunnel build && pnpm --filter rdsh-gateway build

      - name: Install dsh (pnpm, isolated, ignore native builds)
        run: pnpm add --dir "$RUNNER_TEMP/dsh-${{ matrix.dsh }}" --ignore-scripts @deepseek-ai/dsh@${{ matrix.dsh }}

      - name: Smoke test (S1–S7, no API key)
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home-${{ matrix.dsh }}
        run: node scripts/smoke-dsh-compat.mjs --dsh "$RUNNER_TEMP/dsh-${{ matrix.dsh }}/node_modules/.bin/dsh"

      - name: Report incompatibility (schedule only, dedup by dsh version)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ matrix.dsh }}";
            const title = `[compat-ci] dsh ${version} incompatible with rdsh (smoke failed)`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "compat-ci", per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) { core.info(`issue already open: ${existing.html_url}`); return; }
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, labels: ["compat-ci"],
              body: `dsh \`${version}\` smoke test failed against current rdsh.\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`created issue: ${issue.html_url}`);

      - name: Close resolved issue (schedule only)
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ matrix.dsh }}";
            const title = `[compat-ci] dsh ${version} incompatible with rdsh (smoke failed)`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "compat-ci", per_page: 100,
            });
            for (const issue of issues) {
              if (issue.title === title) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: "closed",
                });
                core.info(`closed resolved issue: ${issue.html_url}`);
              }
            }
