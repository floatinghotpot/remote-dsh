name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Public docs boundary
        run: |
          for d in doc/feature doc/fix doc/review doc/ops; do
            if [ -d "$d" ]; then
              echo "::error::$d must live in the private repo (whalelink)"
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc strict across packages)
        run: pnpm build

      - name: Test
        run: pnpm test
